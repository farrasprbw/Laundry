services:
  postgres:
    image: postgres:16-alpine
    container_name: laundry-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-laundry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laundry123}
      POSTGRES_DB: ${DB_NAME:-laundry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-laundry} -d ${DB_NAME:-laundry}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
